<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <title>Sevu – Find Local Services Near You | Plumber, Electrician, Salon & More</title>
    <meta name="description" content="Find verified local service providers near you — plumbers, electricians, salons, AC repair, carpenters and more. Real reviews, instant call & WhatsApp." />
    <meta name="keywords" content="services near me, plumber near me, electrician near me, salon near me, AC repair, local business India, Sevu" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sevu" />
    <meta property="og:title" content="Sevu – Find Local Services Near You" />
    <meta property="og:description" content="Verified local service providers near you. Instant call & WhatsApp." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sevu – Find Local Services Near You" />
    <meta name="twitter:description" content="Verified local service providers near you. Instant call & WhatsApp." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- Default JSON-LD WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sevu",
        "url": "/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/profile?service={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (browser chrome, Android task switcher) -->
    <meta name="theme-color" content="#1e3a7c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1f47" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sevu" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Android / MS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sevu" />
    <meta name="msapplication-TileImage" content="/images/logo.png" />
    <meta name="msapplication-TileColor" content="#1e3a7c" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
