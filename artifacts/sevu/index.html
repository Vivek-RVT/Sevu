<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <title>Sevu – Business Manager</title>
    <meta name="description" content="Track customers, services, and income — all in one place. Built for Indian service providers." />
    <meta name="keywords" content="business management, service provider, customer tracking, income tracker, India" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (browser chrome, Android task switcher) -->
    <meta name="theme-color" content="#1e3a7c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1f47" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sevu" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Android / MS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sevu" />
    <meta name="msapplication-TileImage" content="/images/logo.png" />
    <meta name="msapplication-TileColor" content="#1e3a7c" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
